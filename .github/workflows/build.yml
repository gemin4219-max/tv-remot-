name: Build Unsigned IPA for Sideloading

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15 # Use macOS 15 which includes Xcode 16+
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Patch Swift Tools Version (Downgrade to Swift 5.9 to bypass strict concurrency)
        run: |
          find node_modules -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.[0-9]/swift-tools-version: 5.9/g' {} +

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build Unsigned iOS App
        run: |
          cd ios
          xcodebuild \
            -workspace universalremote.xcworkspace \
            -scheme universalremote \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            build

      - name: Package into .ipa for Sideloading
        run: |
          mkdir -p Payload
          mv ios/build/universalremote.app Payload/
          zip -r universal-remote.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Remote-IPA
          path: universal-remote.ipa
